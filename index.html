<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dapin by TanTan - Formulir Pengajuan Pinjaman</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center py-6 px-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden mb-6">
        <!-- Header Ungu -->
        <div class="bg-purple-700 text-white text-center py-8 px-6 relative overflow-hidden">
            <h1 class="text-2xl font-bold tracking-wide">Dapin by TanTan</h1>
            <p class="text-purple-200 text-sm mt-1">Formulir Pengajuan Pinjaman Tunai Cepat & Mudah</p>
        </div>

        <!-- Form Input -->
        <form id="loanForm" class="p-6 space-y-5">
            
            <!-- Bagian 1: Detail Pinjaman -->
            <div>
                <h2 class="text-purple-900 font-bold text-base mb-3 pb-1 border-b border-purple-100">Detail Pinjaman</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nominal Pinjaman (Rp) *</label>
                        <input type="number" id="jumlahPinjaman" placeholder="Contoh: 1000000" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-purple-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Pilihan Tenor Cicilan *</label>
                        <select id="tenor" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-purple-500 focus:outline-none text-sm bg-white">
                            <option value="">-- Pilih Tenor Cicilan --</option>
                            <option value="7_hari">7 Hari (Bunga 35%)</option>
                            <option value="10_hari">10 Hari (Bunga 40%)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Bagian 2: Data Diri -->
            <div>
                <h2 class="text-purple-900 font-bold text-base mb-3 pb-1 border-b border-purple-100">1. Data Diri Peminjam</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap (Sesuai KTP) *</label>
                        <input type="text" id="nama" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-purple-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nomor WhatsApp Aktif *</label>
                        <input type="tel" id="whatsapp" placeholder="08xxxxxxxxxx" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-purple-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nomor Induk Kependudukan (NIK/KTP) *</label>
                        <input type="text" id="nik" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-purple-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Pekerjaan / Sumber Penghasilan *</label>
                        <input type="text" id="pekerjaan" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-purple-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Alamat Lengkap (Sesuai KTP) *</label>
                        <textarea id="alamat" rows="3" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-purple-500 focus:outline-none text-sm"></textarea>
                    </div>
                </div>
            </div>

            <!-- Bagian 3: Kontak Darurat -->
            <div>
                <h2 class="text-purple-900 font-bold text-base mb-3 pb-1 border-b border-purple-100">2. Kontak Darurat</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Kontak Darurat *</label>
                        <input type="text" id="namaDarurat" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-purple-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Hubungan dengan Peminjam *</label>
                        <input type="text" id="hubungan" placeholder="Contoh: Keluarga/Tetangga" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-purple-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nomor HP Kontak Darurat *</label>
                        <input type="tel" id="hpDarurat" placeholder="08xxxxxxxxxx" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-purple-500 focus:outline-none text-sm">
                    </div>
                </div>
            </div>

            <!-- Tombol Kirim -->
            <button type="submit" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md text-sm mt-4">
                Kirim Pengajuan
            </button>
        </form>
    </div>

    <!-- Script Kalkulasi Otomatis dan Pengiriman ke WhatsApp -->
    <script>
        document.getElementById('loanForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Ambil data dari form
            const nominal = parseFloat(document.getElementById('jumlahPinjaman').value);
            const opsiTenor = document.getElementById('tenor').value;
            const nama = document.getElementById('nama').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const nik = document.getElementById('nik').value;
            const pekerjaan = document.getElementById('pekerjaan').value;
            const alamat = document.getElementById('alamat').value;
            const namaDarurat = document.getElementById('namaDarurat').value;
            const hubungan = document.getElementById('hubungan').value;
            const hpDarurat = document.getElementById('hpDarurat').value;

            // Hitung bunga berdasarkan opsi tenor
            let persenBunga = 0;
            let labelTenor = "";
            
            if (opsiTenor === "7_hari") {
                persenBunga = 0.35; // 35%
                labelTenor = "7 Hari (Bunga 35%)";
            } else if (opsiTenor === "10_hari") {
                persenBunga = 0.40; // 40%
                labelTenor = "10 Hari (Bunga 40%)";
            }

            const nominalBunga = nominal * persenBunga;
            const totalBayar = nominal + nominalBunga;

            // Format angka Rupiah
            const formatRupiah = (angka) => {
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
            };

            // GANTI NOMOR DI BAWAH INI DENGAN NOMOR WHATSAPP KAMU (Awali dengan 62)
            const nomorAdmin = "68131114511"; 

            // Format Pesan WhatsApp
            const pesan = `Halo Admin Dapin by TanTan, saya ingin mengajukan pinjaman dengan detail berikut:%0A%0A` +
                          `*RINCIAN PINJAMAN*%0A` +
                          `- Nominal Pinjaman: ${formatRupiah(nominal)}%0A` +
                          `- Tenor: ${labelTenor}%0A` +
                          `- Estimasi Bunga: ${formatRupiah(nominalBunga)}%0A` +
                          `- *TOTAL HARUS DIBAYAR: ${formatRupiah(totalBayar)}*%0A%0A` +
                          `*1. DATA DIRI PEMINJAM*%0A` +
                          `- Nama: ${nama}%0A` +
                          `- No WhatsApp: ${whatsapp}%0A` +
                          `- NIK: ${nik}%0A` +
                          `- Pekerjaan: ${pekerjaan}%0A` +
                          `- Alamat: ${alamat}%0A%0A` +
                          `*2. KONTAK DARURAT*%0A` +
                          `- Nama: ${namaDarurat}%0A` +
                          `- Hubungan: ${hubungan}%0A` +
                          `- No HP: ${hpDarurat}`;

            // Buka WhatsApp
            window.open(`https://wa.me/${nomorAdmin}?text=${pesan}`, '_blank');
        });
    </script>
</body>
</html>
