<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dapin by TanTan - Pengajuan Pinjaman</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        <!-- Header -->
        <div class="bg-gradient-to-r from-violet-600 to-indigo-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold tracking-wide">Dapin by TanTan</h1>
            <p class="text-violet-200 text-sm mt-1">Layanan Pengajuan Pinjaman Cepat & Aman</p>
        </div>

        <!-- Form Pengajuan -->
        <form id="loanForm" class="p-6 space-y-5">
            <!-- Nominal Pinjaman -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Nominal Pinjaman (Rp)</label>
                <input type="text" id="nominal" required 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-violet-500 focus:border-violet-500 outline-none transition text-slate-800 font-medium"
                    placeholder="Contoh: 500.000" oninput="formatRupiahInput(this)">
                <p class="text-xs text-slate-500 mt-1">Masukkan angka saja, format Rupiah otomatis.</p>
            </div>

            <!-- Tenor Pinjaman -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Pilih Tenor (Durasi)</label>
                <select id="tenor" required
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-violet-500 focus:border-violet-500 outline-none transition text-slate-800 bg-white">
                    <option value="" disabled selected>-- Pilih Tenor Pinjaman --</option>
                    <option value="7">7 Hari (Bunga 35%)</option>
                    <option value="10">10 Hari (Bunga 45%)</option>
                </select>
            </div>

            <!-- Simulasi Otomatis -->
            <div class="bg-violet-50 rounded-xl p-4 border border-violet-100 space-y-2">
                <div class="flex justify-between text-sm text-slate-600">
                    <span>Estimasi Bunga:</span>
                    <span id="displayBunga" class="font-semibold text-violet-700">Rp 0</span>
                </div>
                <div class="flex justify-between text-sm text-slate-800 font-bold border-t border-violet-200 pt-2">
                    <span>Total Harus Dibayar:</span>
                    <span id="displayTotal" class="text-violet-700">Rp 0</span>
                </div>
            </div>

            <hr class="border-slate-200 my-2">

            <!-- Data Diri Peminjam -->
            <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider">1. Data Diri Peminjam</h2>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap (Sesuai KTP)</label>
                <input type="text" id="nama" required 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-violet-500 outline-none transition"
                    placeholder="Nama lengkap Anda">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">No. WhatsApp Aktif</label>
                <input type="tel" id="whatsapp" required inputmode="numeric" pattern="[0-9]*"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-violet-500 outline-none transition"
                    placeholder="Contoh: 08123456789">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nomor KTP (NIK)</label>
                <input type="text" id="nik" required inputmode="numeric" pattern="[0-9]*"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-violet-500 outline-none transition"
                    placeholder="16 digit nomor KTP">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Pekerjaan</label>
                <input type="text" id="pekerjaan" required 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-violet-500 outline-none transition"
                    placeholder="Contoh: Karyawan Swasta / Wirausaha">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Alamat Domisili Sekarang</label>
                <textarea id="alamat" rows="2" required 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-violet-500 outline-none transition"
                    placeholder="Nama jalan, RT/RW, Kecamatan, Kota"></textarea>
            </div>

            <hr class="border-slate-200 my-2">

            <!-- Kontak Darurat -->
            <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider">2. Kontak Darurat (Keluarga/Kerabat)</h2>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Kontak Darurat</label>
                <input type="text" id="namaDarurat" required 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-violet-500 outline-none transition"
                    placeholder="Nama kerabat/keluarga">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Hubungan</label>
                <input type="text" id="hubungan" required 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-violet-500 outline-none transition"
                    placeholder="Contoh: Orang Tua / Saudara / Suami/Istri">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">No. HP Kontak Darurat</label>
                <input type="tel" id="hpDarurat" required inputmode="numeric" pattern="[0-9]*"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-violet-500 outline-none transition"
                    placeholder="Contoh: 08987654321">
            </div>

            <!-- Tombol Submit -->
            <button type="submit" 
                class="w-full bg-violet-600 hover:bg-violet-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-violet-200 transition duration-200">
                Kirim Pengajuan via WhatsApp
            </button>
        </form>
    </div>

    <!-- Script Kalkulator & WhatsApp Sender -->
    <script>
        // Fungsi memformat input nominal menjadi Rupiah dan menyaring hanya angka
        function formatRupiahInput(input) {
            let angkaUnformatted = input.value.replace(/[^,\d]/g, '');
            let split = angkaUnformatted.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }

            input.value = rupiah;
            hitungSimulasi();
        }

        function getNominalAngka() {
            let val = document.getElementById('nominal').value.replace(/\./g, '');
            return parseInt(val) || 0;
        }

        const inputNominal = document.getElementById('nominal');
        const selectTenor = document.getElementById('tenor');
        const displayBunga = document.getElementById('displayBunga');
        const displayTotal = document.getElementById('displayTotal');

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        function hitungSimulasi() {
            const nominal = getNominalAngka();
            const tenor = selectTenor.value;

            if (!nominal || !tenor) {
                displayBunga.innerText = "Rp 0";
                displayTotal.innerText = "Rp 0";
                return;
            }

            let persentase = 0;
            if (tenor === "7") {
                persentase = 0.35; // Bunga 35%
            } else if (tenor === "10") {
                persentase = 0.45; // Bunga 45%
            }

            const nominalBunga = nominal * persentase;
            const totalBayar = nominal + nominalBunga;

            displayBunga.innerText = formatRupiah(nominalBunga);
            displayTotal.innerText = formatRupiah(totalBayar);
        }

        inputNominal.addEventListener('input', hitungSimulasi);
        selectTenor.addEventListener('change', hitungSimulasi);

        // Proses Kirim ke WhatsApp
        document.getElementById('loanForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nominal = getNominalAngka();
            const tenorVal = selectTenor.value;
            const nama = document.getElementById('nama').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const nik = document.getElementById('nik').value;
            const pekerjaan = document.getElementById('pekerjaan').value;
            const alamat = document.getElementById('alamat').value;
            const namaDarurat = document.getElementById('namaDarurat').value;
            const hubungan = document.getElementById('hubungan').value;
            const hpDarurat = document.getElementById('hpDarurat').value;

            let labelTenor = tenorVal === "7" ? "7 Hari (Bunga 35%)" : "10 Hari (Bunga 45%)";
            let persentase = tenorVal === "7" ? 0.35 : 0.45;
            
            const nominalBunga = nominal * persentase;
            const totalBayar = nominal + nominalBunga;

            // GANTI NOMOR DI BAWAH INI DENGAN NOMOR WHATSAPP ANDA (Awali dengan 62 tanpa angka 0 di depan)
            const nomorAdmin = "628131114511"; 

            const pesan = `*HALO ADMIN DAPIN BY TANTAN, SAYA INGIN MENGAJUKAN PINJAMAN*

*📊 RINCIAN PINJAMAN*
- Nominal Pinjaman: ${formatRupiah(nominal)}
- Tenor: ${labelTenor}
- Estimasi Bunga: ${formatRupiah(nominalBunga)}
- *TOTAL HARUS DIBAYAR: ${formatRupiah(totalBayar)}*

*1. DATA DIRI PEMINJAM*
- Nama: ${nama}
- No WhatsApp: ${whatsapp}
- NIK: ${nik}
- Pekerjaan: ${pekerjaan}
- Alamat: ${alamat}

*2. KONTAK DARURAT*
- Nama: ${namaDarurat}
- Hubungan: ${hubungan}
- No HP: ${hpDarurat}`;

            const urlWA = `https://wa.me/${nomorAdmin}?text=${encodeURIComponent(pesan)}`;
            window.open(urlWA, '_blank');
        });
    </script>
</body>
</html>
